name: worker-pump

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-pump
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Process queued work
        env:
          WORKER_CRON_SECRET: ${{ secrets.WORKER_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 300 \
            --request POST \
            --header "Authorization: Bearer ${WORKER_CRON_SECRET}" \
            --header "Content-Type: application/json" \
            --data '{"source":"github_actions"}' \
            https://growth-menager-worker.vercel.app/api/pump
